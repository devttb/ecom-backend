services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: project-name
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: project-name-db
    ports:
      - '3306:3306'
    volumes:
      - db-store:/var/lib/mysql
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-name-backend
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - db
volumes:
  db-store:
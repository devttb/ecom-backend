services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: ecom
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: ecom_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -ppassword --silent"]
      interval: 5s
      timeout: 2s
      retries: 10

    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecom-network
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    depends_on:
      mysql_db:
        condition: service_healthy
    env_file:
      - .env.dev
    networks:
      - ecom-network
volumes:
  mysql_data:

networks:
  ecom-network:
    name: ecom-network